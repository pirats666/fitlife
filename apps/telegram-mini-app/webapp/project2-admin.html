<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project 2 — Тренер</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:#eee;font:15px system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid #292929;display:flex;justify-content:space-between}main{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:10px;margin-bottom:18px}.nav button,.btn{padding:11px 14px;border:0;border-radius:10px;background:#f1c400;color:#111;font-weight:700;cursor:pointer}.card{background:#181818;border:1px solid #303030;border-radius:14px;padding:18px;margin-bottom:15px}.muted{color:#999}.hidden{display:none}input,select,textarea{width:100%;background:#101010;color:#eee;border:1px solid #444;border-radius:9px;padding:11px;margin:5px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.program,.library-item{padding:14px;border:1px solid #333;border-radius:10px;margin:8px 0;cursor:pointer}.program:hover,.library-item:hover{background:#202020}.exercise{border:1px solid #333;border-radius:10px;padding:12px;margin:8px 0}.exercisegrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.danger{background:#3a2020;color:#fff}.error{color:#ff7777}.small{font-size:13px}@media(max-width:650px){.row,.exercisegrid{grid-template-columns:1fr}.nav{flex-wrap:wrap}}</style></head><body><header><b>🏋️ PROJECT 2</b><span class="muted">Личный кабинет тренера</span></header><main><section id="login" class="card"><h2>Вход тренера</h2><p class="muted">Единственный пользователь системы — тренер.</p><input id="token" type="password" placeholder="CRM token"><button class="btn" onclick="login()">Войти</button><p id="err" class="error"></p></section><section id="app" class="hidden"><div class="nav"><button onclick="showList()">📋 Мои программы</button><button onclick="newProgram()">➕ Новая программа</button><button onclick="library()">💪 Библиотека</button></div><div id="list" class="page"></div><div id="editor" class="page hidden"></div><div id="lib" class="page hidden"></div></section></main><script>let token='',current=null;const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers={...(opt.headers||{}),'x-project2-admin-token':token,'content-type':'application/json'};const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j}async function login(){token=$('token').value.trim();try{await api('/api/project2/trainer/programs');$('login').classList.add('hidden');$('app').classList.remove('hidden');showList()}catch(e){$('err').textContent='Неверный токен или API недоступен'}}function hideAll(){$('list').classList.add('hidden');$('editor').classList.add('hidden');$('lib').classList.add('hidden')}async function showList(){const j=await api('/api/project2/trainer/programs');hideAll();$('list').classList.remove('hidden');$('list').innerHTML='<div class="card"><h2>Мои программы</h2><button class="btn" onclick="newProgram()">➕ Создать программу</button></div>'+(j.programs||[]).map(p=>'<div class="program" onclick="openProgram(\''+p.id+'\')"><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.goal||'Цель не указана')+' · '+esc(p.status)+'</span></div>').join('')||'<div class="card muted">Программ пока нет.</div>'}function newProgram(){hideAll();$('editor').classList.remove('hidden');$('editor').innerHTML='<div class="card"><h2>Новая программа</h2><input id="newName" placeholder="Название"><input id="newGoal" placeholder="Цель"><textarea id="newDesc" placeholder="Описание"></textarea><button class="btn" onclick="createProgram()">Создать</button></div>'}async function createProgram(){const n=$('newName').value.trim();if(!n)return;const j=await api('/api/project2/trainer/programs',{method:'POST',body:JSON.stringify({name:n,goal:$('newGoal').value.trim(),description:$('newDesc').value.trim()})});openProgram(j.program.id)}async function openProgram(id){const j=await api('/api/project2/trainer/programs/'+id);current=j.program;renderEditor(j)}function renderEditor(j){hideAll();$('editor').classList.remove('hidden');$('editor').innerHTML='<div class="card"><button onclick="showList()">← Назад</button><h2>'+esc(j.program.name)+'</h2><div class="row"><input id="editName" value="'+esc(j.program.name)+'"><input id="editGoal" value="'+esc(j.program.goal||'')+'"></div><textarea id="editDesc" placeholder="Описание">'+esc(j.program.description||'')+'</textarea><div class="row"><button class="btn" onclick="saveProgram()">💾 Сохранить</button><button class="btn" onclick="changeStatus()">Статус: '+esc(j.program.status)+'</button></div><button class="btn danger" onclick="deleteProgram()">Удалить программу</button></div><div class="card"><h3>Дни тренировок</h3><div class="row"><input id="dayNo" type="number" placeholder="№ дня"><input id="dayTitle" placeholder="Название дня"></div><button class="btn" onclick="addDay()">➕ Добавить день</button><div id="days">'+(j.days||[]).map(dayHtml).join('')+'</div></div>'}function dayHtml(d){return '<div class="card"><div class="row"><h3>День '+d.day_number+' — '+esc(d.title)+'</h3><button class="btn danger" onclick="deleteDay(\''+d.id+'\')">Удалить день</button></div><div>'+(d.exercises||[]).map(e=>'<div class="exercise"><b>'+esc(e.exercise_name)+'</b><div class="muted">'+(e.sets??'—')+' подходов · '+esc(e.reps??'—')+' повторений · '+(e.working_weight_kg??'—')+' кг · '+(e.rest_seconds??'—')+' сек</div><button class="btn" onclick="editExercise(\''+e.id+'\',\''+esc(e.exercise_name).replace(/'/g,'&#39;')+'\')">✏️ Изменить</button> <button class="btn danger" onclick="deleteExercise(\''+e.id+'\')">Удалить</button></div>').join('')||'<p class="muted">Упражнений пока нет.</p>'+'</div><div class="card"><h4>Добавить из библиотеки</h4><input id="libSearch'+d.id+'" placeholder="Поиск упражнения" oninput="searchLibrary(\''+d.id+'\')"><div id="libResults'+d.id+'"></div></div><button class="btn" onclick="manualExercise(\''+d.id+'\')">➕ Ввести вручную</button></div>'}async function searchLibrary(dayId){const q=$(('libSearch'+dayId)).value.trim();if(!q){$('libResults'+dayId).innerHTML='';return}const j=await api('/api/project2/exercises/library?q='+encodeURIComponent(q));$('libResults'+dayId).innerHTML=(j.exercises||[]).map(e=>'<div class="library-item" onclick="chooseExercise(\''+dayId+'\',\''+e.id+'\')"><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.category||'')+' · '+esc(e.muscles||'')+'</span></div>').join('')||'<span class="muted small">Ничего не найдено</span>'}async function chooseExercise(dayId,id){const j=await api('/api/project2/exercises/library');const e=(j.exercises||[]).find(x=>x.id===id);if(!e)return;const sets=prompt('Подходы:','3'),reps=prompt('Повторы:','10'),weight=prompt('Рабочий вес, кг:',''),rest=prompt('Отдых, сек:','60');await api('/api/project2/trainer/days/'+dayId+'/exercises',{method:'POST',body:JSON.stringify({exercise_name:e.name,sets:sets?Number(sets):null,reps,working_weight_kg:weight?Number(weight):null,rest_seconds:rest?Number(rest):null,coach_comment:e.technique||null,video_url:e.video_url||e.gif_url||null})});refresh()}function manualExercise(dayId){const name=prompt('Название упражнения:');if(!name)return;const sets=prompt('Подходы:','3'),reps=prompt('Повторы:','10'),rest=prompt('Отдых, сек:','60');api('/api/project2/trainer/days/'+dayId+'/exercises',{method:'POST',body:JSON.stringify({exercise_name:name,sets:sets?Number(sets):null,reps,rest_seconds:rest?Number(rest):null})}).then(refresh)}async function editExercise(id,name){const ex=prompt('Название упражнения:',name);if(!ex)return;const sets=prompt('Подходы:','3'),reps=prompt('Повторы:','10'),weight=prompt('Рабочий вес, кг:',''),rest=prompt('Отдых, сек:','60');await api('/api/project2/trainer/exercises/'+id,{method:'PATCH',body:JSON.stringify({exercise_name:ex,sets:sets?Number(sets):null,reps,working_weight_kg:weight?Number(weight):null,rest_seconds:rest?Number(rest):null})});refresh()}async function addDay(){await api('/api/project2/trainer/programs/'+current.id+'/days',{method:'POST',body:JSON.stringify({day_number:Number($('dayNo').value),title:$('dayTitle').value.trim()||'Тренировка'})});refresh()}async function refresh(){const j=await api('/api/project2/trainer/programs/'+current.id);current=j.program;renderEditor(j)}async function saveProgram(){await api('/api/project2/trainer/programs/'+current.id,{method:'PATCH',body:JSON.stringify({name:$('editName').value.trim(),goal:$('editGoal').value.trim(),description:$('editDesc').value})});refresh()}async function deleteExercise(id){if(!confirm('Удалить упражнение?'))return;await api('/api/project2/trainer/exercises/'+id,{method:'DELETE'});refresh()}async function deleteDay(id){if(!confirm('Удалить день и его упражнения?'))return;await api('/api/project2/trainer/days/'+id,{method:'DELETE'});refresh()}async function deleteProgram(){if(!confirm('Удалить программу?'))return;await api('/api/project2/trainer/programs/'+current.id,{method:'DELETE'});showList()}async function changeStatus(){const s=prompt('Статус: draft / review / active / archived',current.status);if(!s||!['draft','review','active','archived'].includes(s))return;await api('/api/project2/trainer/programs/'+current.id,{method:'PATCH',body:JSON.stringify({status:s})});refresh()}async function library(){hideAll();$('lib').classList.remove('hidden');$('lib').innerHTML='<div class="card"><h2>💪 Библиотека упражнений</h2><input id="lq" placeholder="Поиск по названию, мышцам..." oninput="loadLibrary()"><button class="btn" onclick="newLibraryExercise()">➕ Добавить упражнение</button><div id="libraryList"></div></div>';loadLibrary()}async function loadLibrary(){const j=await api('/api/project2/exercises/library?q='+encodeURIComponent(($('lq')?.value||'')));$('libraryList').innerHTML=(j.exercises||[]).map(e=>'<div class="library-item"><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.category||'')+' · '+esc(e.muscles||'')+'</span><br><span class="small">'+esc(e.technique||'')+'</span><br><button class="btn" onclick="editLibrary(\''+e.id+'\')">✏️</button> <button class="btn danger" onclick="deleteLibrary(\''+e.id+'\')">🗑️</button></div>').join('')||'<p class="muted">Библиотека пока пуста.</p>'}async function newLibraryExercise(){const name=prompt('Название упражнения:');if(!name)return;const category=prompt('Категория:','Силовые'),muscles=prompt('Мышцы:'),technique=prompt('Техника выполнения:'),video_url=prompt('Ссылка на видео:'),gif_url=prompt('Ссылка на GIF:');await api('/api/project2/exercises/library',{method:'POST',body:JSON.stringify({name,category,muscles,technique,video_url,gif_url})});loadLibrary()}async function editLibrary(id){const j=await api('/api/project2/exercises/library'),e=j.exercises.find(x=>x.id===id);if(!e)return;const name=prompt('Название:',e.name),category=prompt('Категория:',e.category||''),muscles=prompt('Мышцы:',e.muscles||''),technique=prompt('Техника:',e.technique||''),video_url=prompt('Видео:',e.video_url||''),gif_url=prompt('GIF:',e.gif_url||'');await api('/api/project2/exercises/library/'+id,{method:'PATCH',body:JSON.stringify({name,category,muscles,technique,video_url,gif_url})});loadLibrary()}async function deleteLibrary(id){if(!confirm('Удалить упражнение из библиотеки?'))return;await api('/api/project2/exercises/library/'+id,{method:'DELETE'});loadLibrary()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
