<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d0f" />
  <title>FitLife</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <span class="eyebrow">FITLIFE</span>
        <h1 id="screenTitle">Привет 👋</h1>
        <p id="screenSubtitle" class="subtitle">Твой путь к системному результату</p>
      </div>
      <button class="avatar" id="profileButton" data-screen="profile" aria-label="Профиль">👤</button>
    </header>

    <main id="screenContent"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="active" data-screen="home">⌂<span>Главная</span></button>
      <button data-screen="workouts">💪<span>Тренировки</span></button>
      <button data-screen="progress">📈<span>Прогресс</span></button>
      <button data-screen="profile">👤<span>Профиль</span></button>
    </nav>
  </div>
  <script src="./app.js"></script>
</body>
</html>
