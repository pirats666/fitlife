<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project 2 — Тренер</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:#eee;font:15px system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid #292929;display:flex;justify-content:space-between;gap:12px}main{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.nav button,.btn{padding:11px 14px;border:0;border-radius:10px;background:#f1c400;color:#111;font-weight:700;cursor:pointer}.btn.secondary{background:#292929;color:#eee}.btn.danger{background:#3a2020;color:#fff}.btn.small{padding:7px 9px;font-size:13px}.card{background:#181818;border:1px solid #303030;border-radius:14px;padding:18px;margin-bottom:15px}.muted{color:#999}.hidden{display:none}.error{color:#ff7777}input,select,textarea{width:100%;background:#101010;color:#eee;border:1px solid #444;border-radius:9px;padding:11px;margin:5px 0}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.program,.library-item{padding:14px;border:1px solid #333;border-radius:10px;margin:8px 0}.program{cursor:pointer}.program:hover,.library-item:hover{background:#202020}.exercise{border:1px solid #333;border-radius:10px;padding:12px;margin:8px 0}.exercise-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.exercise-actions{display:flex;gap:6px;flex-wrap:wrap}.order-buttons{display:flex;gap:4px}.small{font-size:13px}.search-results{max-height:230px;overflow:auto}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.hidden{display:none}.modal-box{width:min(680px,100%);max-height:90vh;overflow:auto;background:#181818;border:1px solid #444;border-radius:16px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:none;color:#aaa;border:0;font-size:26px;cursor:pointer}.toast{position:fixed;right:16px;bottom:16px;background:#222;border:1px solid #555;border-radius:10px;padding:12px 16px;z-index:20;display:none}.toast.show{display:block}@media(max-width:650px){.row{grid-template-columns:1fr}.exercise-top{flex-direction:column}.modal{align-items:flex-end;padding:0}.modal-box{border-radius:16px 16px 0 0}}</style></head><body><header><b>🏋️ PROJECT 2</b><span class="muted">Личный кабинет тренера</span></header><main><section id="login" class="card"><h2>Вход тренера</h2><p class="muted">Единственный пользователь системы — тренер.</p><input id="token" type="password" placeholder="CRM token"><button class="btn" onclick="login()">Войти</button><p id="err" class="error"></p></section><section id="app" class="hidden"><div class="nav"><button onclick="home()">🏠 Главная</button><button onclick="showList()">📋 Мои программы</button><button onclick="newProgram()">➕ Новая программа</button><button onclick="generator()">⚡ Генератор</button><button onclick="library()">💪 Библиотека</button><button onclick="journal()">📈 Журнал</button><button onclick="dashboard()">📊 Аналитика</button><button onclick="calendar()">🗓️ Календарь</button><button onclick="nutrition()">🥗 Питание</button></div><div id="list" class="page"></div><div id="editor" class="page hidden"></div><div id="lib" class="page hidden"></div></section></main><script>let token='',current=null;const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers={...(opt.headers||{}),'x-project2-admin-token':token,'content-type':'application/json'};const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j}async function login(){token=$('token').value.trim();try{await api('/api/project2/trainer/programs');$('login').classList.add('hidden');$('app').classList.remove('hidden');home()}catch(e){$('err').textContent='Неверный токен или API недоступен'}}function hideAll(){$('list').classList.add('hidden');$('editor').classList.add('hidden');$('lib').classList.add('hidden')}async function home(){hideAll();$('list').classList.remove('hidden');$('list').innerHTML='<div class="card"><h2>🏠 Панель тренера</h2><p class="muted">Все рабочие инструменты Project 2 в одном месте.</p><div class="row"><button class="btn" onclick="newProgram()">➕ Новая программа</button><button class="btn secondary" onclick="generator()">⚡ Сгенерировать программу</button></div></div><div class="row"><div class="card"><h3>📋 Программы</h3><div id="hsPrograms">…</div></div><div class="card"><h3>📈 Тренировки</h3><div id="hsSessions">…</div></div><div class="card"><h3>🎯 Средний RPE</h3><div id="hsRpe">…</div></div><div class="card"><h3>📝 Записи упражнений</h3><div id="hsLogs">…</div></div></div><div class="card"><h3>🚀 Быстрые действия</h3><div class="nav"><button class="btn secondary" onclick="library()">💪 Библиотека</button><button class="btn secondary" onclick="journal()">📈 Журнал</button><button class="btn secondary" onclick="calendar()">🗓️ Календарь</button><button class="btn secondary" onclick="nutrition()">🥗 Питание</button></div></div>';try{const [a,p,j]=await Promise.all([api('/api/project2/trainer/tools/analytics'),api('/api/project2/trainer/programs'),api('/api/project2/trainer/journal?limit=5')]);$('hsPrograms').textContent=a.programs.count;$('hsSessions').textContent=a.training_sessions.count;$('hsRpe').textContent=Number(a.training_sessions.avg_rpe||0).toFixed(1);$('hsLogs').textContent=a.exercise_logs.count}catch(e){toast(e.message,false)}}async function showList(){const j=await api('/api/project2/trainer/programs');hideAll();$('list').classList.remove('hidden');$('list').innerHTML='<div class="card"><h2>Мои программы</h2><button class="btn" onclick="newProgram()">➕ Создать программу</button></div>'+(j.programs||[]).map(p=>'<div class="program" onclick="openProgram(\''+p.id+'\')"><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.goal||'Цель не указана')+' · '+esc(p.status)+'</span></div>').join('')||'<div class="card muted">Программ пока нет.</div>'}function generator(){hideAll();$('editor').classList.remove('hidden');$('editor').innerHTML='<div class="card"><h2>⚡ Генератор программы</h2><p class="muted">Создаёт черновик, который можно редактировать вручную.</p><label>Цель<input id="gGoal" placeholder="Например: набор мышечной массы"></label><div class="row"><label>Уровень<select id="gLevel"><option value="beginner">Начинающий</option><option value="intermediate">Средний</option><option value="advanced">Продвинутый</option></select></label><label>Тренировок в неделю<select id="gDays"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label></div><label>Место<select id="gLocation"><option value="gym">Зал</option><option value="home">Дом</option><option value="outdoor">Улица</option></select></label><div class="row"><label>Оборудование<input id="gEquipment" placeholder="Например: гантели, блок"></label><label>Ограничения<input id="gLimitations" placeholder="Например: колени, поясница"></label></div><button class="btn" onclick="generateProgram()">⚡ Создать черновик</button></div>'}
function newProgram(){hideAll();$('editor').classList.remove('hidden');$('editor').innerHTML='<div class="card"><h2>Новая программа</h2><input id="newName" placeholder="Название"><input id="newGoal" placeholder="Цель"><textarea id="newDesc" placeholder="Описание"></textarea><button class="btn" onclick="createProgram()">Создать</button></div>'}async function generateProgram(){const goal=$('gGoal').value.trim();if(!goal)return toast('Укажите цель',false);try{const j=await api('/api/project2/trainer/programs/generate',{method:'POST',body:JSON.stringify({goal,level:$('gLevel').value,days_count:Number($('gDays').value),location:$('gLocation').value,equipment:$('gEquipment').value,limitations:$('gLimitations').value})});toast('Черновик создан');openProgram(j.program_id)}catch(e){toast(e.message,false)}}
async function createProgram(){const n=$('newName').value.trim();if(!n)return;const j=await api('/api/project2/trainer/programs',{method:'POST',body:JSON.stringify({name:n,goal:$('newGoal').value.trim(),description:$('newDesc').value.trim()})});openProgram(j.program.id)}async function reviewProgram(){try{await api('/api/project2/trainer/programs/'+current.id+'/review',{method:'POST',body:'{}'});toast('Программа отправлена на проверку');refresh()}catch(e){toast(e.message,false)}}async function activateProgram(){try{await api('/api/project2/trainer/programs/'+current.id+'/activate',{method:'POST',body:'{}'});toast('Программа активирована');refresh()}catch(e){toast(e.message,false)}}
async function openProgram(id){const j=await api('/api/project2/trainer/programs/'+id);current=j.program;renderEditor(j)}function renderEditor(j){hideAll();$('editor').classList.remove('hidden');$('editor').innerHTML='<div class="card"><button onclick="showList()">← Назад</button><h2>'+esc(j.program.name)+'</h2><div class="row"><input id="editName" value="'+esc(j.program.name)+'"><input id="editGoal" value="'+esc(j.program.goal||'')+'"></div><textarea id="editDesc" placeholder="Описание">'+esc(j.program.description||'')+'</textarea><div class="row"><button class="btn" onclick="saveProgram()">💾 Сохранить</button><button class="btn" onclick="changeStatus()">Статус: '+esc(j.program.status)+'</button></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" onclick="deleteProgram()">Удалить программу</button><button class="btn secondary" onclick="duplicateProgram()">📋 Дублировать программу</button></div></div><div class="card"><h3>Дни тренировок</h3><div class="row"><input id="dayNo" type="number" placeholder="№ дня"><input id="dayTitle" placeholder="Название дня"></div><button class="btn" onclick="addDay()">➕ Добавить день</button><div id="days">'+(j.days||[]).map(dayHtml).join('')+'</div></div>'}function dayHtml(d){return '<div class="card"><div class="exercise-top"><div><h3 style="margin:0">День '+d.day_number+' — '+esc(d.title)+'</h3><span class="muted small">'+(d.exercises||[]).length+' упражнений</span></div><div class="exercise-actions"><button class="btn small secondary" onclick="reviewProgram()">🔎 На проверку</button><button class="btn small" onclick="activateProgram()">🚀 Активировать</button><button class="btn small secondary" onclick="openDayModal(\''+d.id+'\')">✏️ День</button><button class="btn small danger" onclick="deleteDay(\''+d.id+'\')">Удалить</button></div></div><div>'+(d.exercises||[]).map((e,i,a)=>exerciseHtml(e,i,a,d.id)).join('')||'<p class="muted">Упражнений пока нет.</p>'+'</div><button class="btn" onclick="openExerciseModal(\''+d.id+'\')">➕ Добавить упражнение</button></div>'}
function exerciseHtml(e,i,a,dayId){return '<div class="exercise"><div class="exercise-top"><div><b>'+esc(e.exercise_name)+'</b><div class="muted">'+(e.sets??'—')+' подходов · '+esc(e.reps??'—')+' повторений · '+(e.working_weight_kg??'—')+' кг · '+(e.rest_seconds??'—')+' сек</div>'+(e.coach_comment?'<div class="small" style="margin-top:5px">'+esc(e.coach_comment)+'</div>':'')+'</div><div class="exercise-actions"><div class="order-buttons">'+(i>0?'<button class="btn small secondary" onclick="moveExercise(\''+e.id+'\',-1)">↑</button>':'')+(i<a.length-1?'<button class="btn small secondary" onclick="moveExercise(\''+e.id+'\',1)">↓</button>':'')+'</div><button class="btn small" onclick="openExerciseModal(\''+dayId+'\',\''+e.id+'\')">✏️</button><button class="btn small danger" onclick="deleteExercise(\''+e.id+'\')">Удалить</button></div></div></div>'}
async function searchLibrary(dayId){const q=$(('libSearch'+dayId)).value.trim();if(!q){$('libResults'+dayId).innerHTML='';return}const j=await api('/api/project2/exercises/library?q='+encodeURIComponent(q));$('libResults'+dayId).innerHTML=(j.exercises||[]).map(e=>'<div class="library-item" onclick="chooseExercise(\''+dayId+'\',\''+e.id+'\')"><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.category||'')+' · '+esc(e.muscles||'')+'</span></div>').join('')||'<span class="muted small">Ничего не найдено</span>'}async function openModal(title,body,actions){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=actions||'';$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function confirmModal(title,msg){return new Promise(resolve=>{openModal(title,'<p>'+esc(msg)+'</p>','<button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn danger" id="confirmYes">Удалить</button>');$('confirmYes').onclick=()=>{closeModal();resolve(true)}})}
function openDayModal(id=''){const d=id?(current.days||[]).find(x=>x.id===id):null;openModal(id?'Редактировать день':'Новый день','<div class="row"><label>Номер дня<input id="mDayNo" type="number" min="1" value="'+(d?.day_number||((current.days||[]).length+1))+'"></label><label>Название<input id="mDayTitle" value="'+esc(d?.title||'Тренировка')+'"></label></div>','<button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" onclick="saveDayModal(\''+id+'\')">Сохранить</button>')}
async function saveDayModal(id){try{const no=Number($('mDayNo').value),title=$('mDayTitle').value.trim()||'Тренировка';if(!Number.isInteger(no)||no<1)return toast('Номер дня должен быть ≥ 1',false);if(id)await api('/api/project2/trainer/days/'+id,{method:'PATCH',body:JSON.stringify({day_number:no,title})});else await api('/api/project2/trainer/programs/'+current.id+'/days',{method:'POST',body:JSON.stringify({day_number:no,title})});closeModal();toast('День сохранён');refresh()}catch(e){toast(e.message,false)}}
function openExerciseModal(dayId,id=''){const d=(current.days||[]).find(x=>x.id===dayId),e=id?(d?.exercises||[]).find(x=>x.id===id):null;openModal(e?'Редактировать упражнение':'Добавить упражнение','<label>Название<input id="mExName" value="'+esc(e?.exercise_name||'')+'" placeholder="Например: Приседания"></label><div class="row"><label>Подходы<input id="mSets" type="number" min="0" value="'+(e?.sets??3)+'"></label><label>Повторы<input id="mReps" value="'+esc(e?.reps??'10')+'"></label><label>Вес, кг<input id="mWeight" type="number" min="0" step="0.1" value="'+(e?.working_weight_kg??'')+'"></label><label>Отдых, сек<input id="mRest" type="number" min="0" value="'+(e?.rest_seconds??60)+'"></label></div><label>Комментарий тренера<textarea id="mComment">'+esc(e?.coach_comment||'')+'</textarea></label><label>Видео URL<input id="mVideo" value="'+esc(e?.video_url||'')+'"></label><div class="card" style="margin:10px 0 0;padding:12px"><b>Из библиотеки</b><input id="mLibSearch" placeholder="Поиск упражнения" oninput="modalLibrarySearch()"><div id="mLibResults" class="search-results"></div></div>','<button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" onclick="saveExerciseModal(\''+dayId+'\',\''+id+'\')">Сохранить</button>')}
async function modalLibrarySearch(){const q=$('mLibSearch').value.trim();if(!q)return $('mLibResults').innerHTML='';try{const j=await api('/api/project2/exercises/library?q='+encodeURIComponent(q));$('mLibResults').innerHTML=(j.exercises||[]).map(e=>'<div class="library-item" onclick="pickLibrary(\''+e.id+'\')"><b>'+esc(e.name)+'</b><br><span class="muted small">'+esc(e.category||'')+' · '+esc(e.muscles||'')+'</span></div>').join('')||'<span class="muted small">Ничего не найдено</span>'}catch(e){toast(e.message,false)}}
async function pickLibrary(id){const j=await api('/api/project2/exercises/library');const e=(j.exercises||[]).find(x=>x.id===id);if(!e)return;$('mExName').value=e.name||'';$('mComment').value=e.technique||e.description||'';$('mVideo').value=e.video_url||e.gif_url||'';toast('Данные из библиотеки подставлены')}
async function saveExerciseModal(dayId,id){try{const b={exercise_name:$('mExName').value.trim(),sets:$('mSets').value===''?null:Number($('mSets').value),reps:$('mReps').value.trim()||null,working_weight_kg:$('mWeight').value===''?null:Number($('mWeight').value),rest_seconds:$('mRest').value===''?null:Number($('mRest').value),coach_comment:$('mComment').value.trim()||null,video_url:$('mVideo').value.trim()||null};if(!b.exercise_name)return toast('Введите название упражнения',false);if(id)await api('/api/project2/trainer/exercises/'+id,{method:'PATCH',body:JSON.stringify(b)});else await api('/api/project2/trainer/days/'+dayId+'/exercises',{method:'POST',body:JSON.stringify(b)});closeModal();toast('Упражнение сохранено');refresh()}catch(e){toast(e.message,false)}}
async function moveExercise(id,dir){for(const d of current.days||[]){const i=(d.exercises||[]).findIndex(e=>e.id===id);if(i<0)continue;const a=d.exercises.slice(),n=i+dir;if(n<0||n>=a.length)return;[a[i],a[n]]=[a[n],a[i]];try{await api('/api/project2/trainer/days/'+d.id+'/exercises/reorder',{method:'PATCH',body:JSON.stringify({exercise_ids:a.map(e=>e.id)})});refresh()}catch(e){toast(e.message,false)}return}}
async function addDay(){openDayModal()})});refresh()}async function refresh(){const j=await api('/api/project2/trainer/programs/'+current.id);current=j.program;renderEditor(j)}async function saveProgram(){await api('/api/project2/trainer/programs/'+current.id,{method:'PATCH',body:JSON.stringify({name:$('editName').value.trim(),goal:$('editGoal').value.trim(),description:$('editDesc').value})});refresh()}async function deleteExercise(id){if(!confirm('Удалить упражнение?'))return;await api('/api/project2/trainer/exercises/'+id,{method:'DELETE'});refresh()}async function deleteDay(id){if(!confirm('Удалить день и его упражнения?'))return;await api('/api/project2/trainer/days/'+id,{method:'DELETE'});refresh()}async function duplicateProgram(){try{const name=prompt('Название копии:',current.name+' — копия');if(!name)return;const j=await api('/api/project2/trainer/programs/'+current.id+'/duplicate',{method:'POST',body:JSON.stringify({name})});toast('Программа скопирована');openProgram(j.program.id)}catch(e){toast(e.message,false)}}async function deleteProgram(){if(!confirm('Удалить программу?'))return;await api('/api/project2/trainer/programs/'+current.id,{method:'DELETE'});showList()}async function changeStatus(){const s=prompt('Статус: draft / review / active / archived',current.status);if(!s||!['draft','review','active','archived'].includes(s))return;await api('/api/project2/trainer/programs/'+current.id,{method:'PATCH',body:JSON.stringify({status:s})});refresh()}async async function dashboard(){hideAll();$('lib').classList.remove('hidden');$('lib').innerHTML='<div class="card"><h2>📊 Аналитика</h2><div id="stats">Загрузка...</div></div>';try{const j=await api('/api/project2/trainer/tools/analytics');$('stats').innerHTML='<h3>Программы: '+j.programs.count+'</h3><p>Тренировок в журнале: '+j.training_sessions.count+'</p><p>Средний общий RPE: '+Number(j.training_sessions.avg_rpe||0).toFixed(1)+'</p><p>Записей упражнений: '+j.exercise_logs.count+'</p><p>Средний RPE упражнений: '+Number(j.exercise_logs.avg_rpe||0).toFixed(1)+'</p>'}catch(e){toast(e.message,false)}}
async function calendar(){hideAll();$('lib').classList.remove('hidden');$('lib').innerHTML='<div class="card"><h2>🗓️ Календарь</h2><label>Событие<input id="ceTitle" placeholder="Тренировка"></label><label>Дата<input id="ceDate" type="date"></label><label>Заметка<textarea id="ceNotes"></textarea></label><button class="btn" onclick="addCalendar()">Добавить</button></div><div class="card"><div id="calList">Загрузка...</div></div>';try{const j=await api('/api/project2/trainer/tools/calendar');$('calList').innerHTML=(j.events||[]).map(e=>'<div class="program"><b>'+esc(e.event_date)+'</b> — '+esc(e.title)+(e.notes?'<br>'+esc(e.notes):'')+'</div>').join('')||'<p class="muted">Событий нет.</p>'}catch(e){toast(e.message,false)}}
async function addCalendar(){try{await api('/api/project2/trainer/tools/calendar',{method:'POST',body:JSON.stringify({title:$('ceTitle').value.trim(),event_date:$('ceDate').value,notes:$('ceNotes').value})});toast('Событие добавлено');calendar()}catch(e){toast(e.message,false)}}
async function nutrition(){hideAll();$('lib').classList.remove('hidden');$('lib').innerHTML='<div class="card"><h2>🥗 Питание</h2><label>Название<input id="nName" placeholder="План питания"></label><label>Цель<input id="nGoal"></label><div class="row"><label>Ккал<input id="nCal" type="number"></label><label>Белок, г<input id="nP" type="number"></label><label>Жиры, г<input id="nF" type="number"></label><label>Углеводы, г<input id="nC" type="number"></label></div><label>Заметки<textarea id="nNotes"></textarea></label><button class="btn" onclick="addNutrition()">Сохранить план</button></div><div class="card"><div id="nList">Загрузка...</div></div>';try{const j=await api('/api/project2/trainer/tools/nutrition');$('nList').innerHTML=(j.plans||[]).map(p=>'<div class="program"><b>'+esc(p.name)+'</b><br>'+esc(p.goal||'')+' · '+(p.calories||'—')+' ккал · Б '+(p.protein_g||'—')+' / Ж '+(p.fat_g||'—')+' / У '+(p.carbs_g||'—')+'</div>').join('')||'<p class="muted">Планов нет.</p>'}catch(e){toast(e.message,false)}}
async function addNutrition(){try{await api('/api/project2/trainer/tools/nutrition',{method:'POST',body:JSON.stringify({name:$('nName').value.trim(),goal:$('nGoal').value.trim(),calories:Number($('nCal').value)||null,protein_g:Number($('nP').value)||null,fat_g:Number($('nF').value)||null,carbs_g:Number($('nC').value)||null,notes:$('nNotes').value})});toast('План сохранён');nutrition()}catch(e){toast(e.message,false)}}
async function journal(){hideAll();$('lib').classList.remove('hidden');$('lib').innerHTML='<div class="card"><h2>📈 Журнал тренировок</h2><p class="muted">История выполненных тренировок и RPE.</p><div id="journalList">Загрузка...</div></div>';try{const j=await api('/api/project2/trainer/journal');$('journalList').innerHTML=(j.sessions||[]).map(s=>'<div class="program"><b>'+new Date(s.performed_at).toLocaleString('ru-RU')+'</b><br><span class="muted">'+(s.duration_minutes?s.duration_minutes+' мин · ':'')+(s.overall_rpe?'RPE '+s.overall_rpe:'RPE не указан')+'</span>'+(s.coach_comment?'<br>'+esc(s.coach_comment):'')+'</div>').join('')||'<p class="muted">Записей пока нет.</p>'}catch(e){toast(e.message,false)}}function library(){hideAll();$('lib').classList.remove('hidden');$('lib').innerHTML='<div class="card"><h2>💪 Библиотека упражнений</h2><input id="lq" placeholder="Поиск по названию, мышцам..." oninput="loadLibrary()"><button class="btn" onclick="newLibraryExercise()">➕ Добавить упражнение</button><div id="libraryList"></div></div>';loadLibrary()}async function loadLibrary(){const j=await api('/api/project2/exercises/library?q='+encodeURIComponent(($('lq')?.value||'')));$('libraryList').innerHTML=(j.exercises||[]).map(e=>'<div class="library-item"><b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.category||'')+' · '+esc(e.muscles||'')+'</span><br><span class="small">'+esc(e.technique||'')+'</span><br><button class="btn" onclick="editLibrary(\''+e.id+'\')">✏️</button> <button class="btn danger" onclick="deleteLibrary(\''+e.id+'\')">🗑️</button></div>').join('')||'<p class="muted">Библиотека пока пуста.</p>'}async function newLibraryExercise(){const name=prompt('Название упражнения:');if(!name)return;const category=prompt('Категория:','Силовые'),muscles=prompt('Мышцы:'),technique=prompt('Техника выполнения:'),video_url=prompt('Ссылка на видео:'),gif_url=prompt('Ссылка на GIF:');await api('/api/project2/exercises/library',{method:'POST',body:JSON.stringify({name,category,muscles,technique,video_url,gif_url})});loadLibrary()}async function editLibrary(id){const j=await api('/api/project2/exercises/library'),e=j.exercises.find(x=>x.id===id);if(!e)return;const name=prompt('Название:',e.name),category=prompt('Категория:',e.category||''),muscles=prompt('Мышцы:',e.muscles||''),technique=prompt('Техника:',e.technique||''),video_url=prompt('Видео:',e.video_url||''),gif_url=prompt('GIF:',e.gif_url||'');await api('/api/project2/exercises/library/'+id,{method:'PATCH',body:JSON.stringify({name,category,muscles,technique,video_url,gif_url})});loadLibrary()}async function deleteLibrary(id){if(!confirm('Удалить упражнение из библиотеки?'))return;await api('/api/project2/exercises/library/'+id,{method:'DELETE'});loadLibrary()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function logWorkout(programId,dayId){const j=await api('/api/project2/trainer/programs/'+programId);const d=(j.days||[]).find(x=>x.id===dayId);if(!d)return;const rows=(d.exercises||[]).map((e,i)=>'<div class="program"><b>'+esc(e.exercise_name)+'</b><div class="row"><input id="ls'+i+'" type="number" placeholder="Подходы"><input id="lr'+i+'" placeholder="Повторы"><input id="lw'+i+'" type="number" step="0.1" placeholder="Вес"><input id="le'+i+'" type="number" min="1" max="10" step="0.1" placeholder="RPE"></div></div>').join('');openModal('Отметить тренировку','<label>Дата<input id="ld" type="datetime-local"></label><div class="row"><label>Минуты<input id="lm" type="number"></label><label>Общий RPE<input id="lo" type="number" min="1" max="10" step="0.1"></label></div><label>Комментарий<textarea id="lc"></textarea></label>'+rows,'<button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" onclick="saveWorkout(\''+programId+'\',\''+dayId+'\')">Сохранить</button>')}async function saveWorkout(programId,dayId){try{const j=await api('/api/project2/trainer/programs/'+programId),d=(j.days||[]).find(x=>x.id===dayId);const exercises=(d.exercises||[]).map((e,i)=>({exercise_id:e.id,exercise_name:e.exercise_name,sets_completed:Number($('ls'+i).value)||null,reps_completed:$('lr'+i).value.trim()||null,working_weight_kg:$('lw'+i).value===''?null:Number($('lw'+i).value),rpe:$('le'+i).value===''?null:Number($('le'+i).value)}));await api('/api/project2/trainer/journal',{method:'POST',body:JSON.stringify({program_id:programId,day_id:dayId,performed_at:$('ld').value||null,duration_minutes:Number($('lm').value)||null,overall_rpe:Number($('lo').value)||null,coach_comment:$('lc').value.trim()||null,exercises})});closeModal();toast('Тренировка сохранена');journal()}catch(e){toast(e.message,false)}}
</script></body></html>
