<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project 2 CRM</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#111;color:#f5f5f5}header{padding:18px 22px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{background:#191919;border:1px solid #333;border-radius:14px;padding:16px;margin-bottom:14px}input,textarea,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #444;background:#101010;color:#fff;padding:11px;margin:5px 0}button{cursor:pointer;background:#f1c400;color:#111;border:0;font-weight:700}.client{padding:12px;border-bottom:1px solid #333;cursor:pointer}.client:hover{background:#222}.muted{color:#999}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}
</style></head><body><header><strong>🏋️ Project 2 CRM</strong><span class="muted">Fitness Support</span></header><main>
<section id="login" class="card"><h2>Вход тренера</h2><p class="muted">Введите CRM-токен, настроенный для Проекта 2.</p><input id="token" type="password" placeholder="CRM token"><button onclick="login()">Войти</button><p id="loginError"></p></section>
<section id="crm" class="hidden"><div class="grid"><aside class="card"><h3>Клиенты</h3><input id="search" placeholder="Поиск..." oninput="renderClients()"><div id="clients"></div></aside><article id="detail"><div class="card"><h2>Выберите клиента</h2><p class="muted">После заполнения анкеты клиент появится здесь.</p></div></article></div></section>
</main><script>
let token='',clients=[],selected=null;
const $=id=>document.getElementById(id);
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'x-project2-admin-token':token,'content-type':'application/json'};const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j}
async function login(){token=$('token').value.trim();if(!token)return;$('loginError').textContent='';try{await loadClients();$('login').classList.add('hidden');$('crm').classList.remove('hidden')}catch(e){$('loginError').textContent='Неверный токен или CRM недоступна'}} 
async function loadClients(){const j=await api('/api/project2/crm/clients');clients=j.clients||[];renderClients()}
function renderClients(){const q=$('search').value.toLowerCase();$('clients').innerHTML=clients.filter(c=>(c.first_name||'').toLowerCase().includes(q)||(c.username||'').toLowerCase().includes(q)).map(c=>`<div class="client" onclick="openClient('${c.id}')"><b>${c.first_name||'Без имени'}</b><br><span class="muted">@${c.username||'—'} · ${c.status}</span></div>`).join('')||'<p class="muted">Клиентов пока нет</p>'}
async function openClient(id){const j=await api('/api/project2/crm/clients/'+encodeURIComponent(id));selected=j.client;$('detail').innerHTML=`<div class="card"><h2>${selected.first_name||'Клиент'} ${selected.last_name||''}</h2><p class="muted">@${selected.username||'—'} · Telegram ID ${selected.telegram_id}</p><div class="row"><div><b>Цель</b><br>${selected.goal||'—'}</div><div><b>Опыт</b><br>${selected.experience||'—'}</div><div><b>Место</b><br>${selected.location||'—'}</div><div><b>Тренировок</b><br>${selected.days_per_week||'—'} / нед.</div></div></div>
<div class="card"><h3>Программы</h3><div id="programs">${j.programs.map(p=>'<div class="client"><b>'+p.name+'</b><br><span class="muted">'+p.status+'</span></div>').join('')||'<span class="muted">Пока нет программ</span>'}</div><input id="programName" placeholder="Название новой программы"><button onclick="addProgram()">Создать программу</button></div>
<div class="card"><h3>Измерения</h3><div class="row"><input id="weight" placeholder="Вес, кг"><input id="waist" placeholder="Талия, см"></div><button onclick="addMeasurement()">Добавить измерение</button><div>${j.measurements.map(m=>'<p>'+m.measured_on+' · '+(m.body_weight_kg||'—')+' кг · талия '+(m.waist_cm||'—')+' см</p>').join('')}</div></div>
<div class="card"><h3>Заметки</h3><textarea id="note" placeholder="Заметка тренера"></textarea><button onclick="addNote()">Сохранить заметку</button><div>${j.notes.map(n=>'<p>'+n.note+'</p>').join('')}</div></div>
<div class="card"><h3>Оплаты</h3><input id="amount" placeholder="Сумма"><input id="package" placeholder="Пакет/услуга"><button onclick="addPayment()">Добавить оплату</button></div>`}
async function refresh(){await loadClients();if(selected)await openClient(selected.id)}
async function addProgram(){const n=$('programName').value.trim();if(!n)return;await api('/api/project2/crm/clients/'+selected.id+'/programs',{method:'POST',body:JSON.stringify({name:n,goal:selected.goal})});await refresh()}
async function addMeasurement(){await api('/api/project2/crm/clients/'+selected.id+'/measurements',{method:'POST',body:JSON.stringify({body_weight_kg:Number($('weight').value)||null,waist_cm:Number($('waist').value)||null})});await refresh()}
async function addNote(){const n=$('note').value.trim();if(!n)return;await api('/api/project2/crm/clients/'+selected.id+'/notes',{method:'POST',body:JSON.stringify({note:n})});await refresh()}
async function addPayment(){await api('/api/project2/crm/clients/'+selected.id+'/payments',{method:'POST',body:JSON.stringify({amount:Number($('amount').value)||0,package_name:$('package').value.trim()||null})});await refresh()}
</script></body></html>
